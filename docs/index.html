<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTL 데일리 브리프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --text:#1d2330; --muted:#677084; --line:#e3e6ec;
  --accent:#2457c5; --accent-soft:#e8eefb; --new:#d9480f; --chip:#eef0f4;
  --t1:#2457c5; --t2:#0b7a5c; --t3:#7a4cc2; --t4:#b5520b; --t5:#9a3366; --t6:#7a6a00; --t7:#0b6f8a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1b1f27; --text:#e6e9ef; --muted:#9aa3b5; --line:#2b313d;
  --accent:#7ea2ff; --accent-soft:#22304f; --new:#ff8a50; --chip:#262b36;
  --t1:#7ea2ff; --t2:#4fd1a5; --t3:#b79bff; --t4:#ffaa66; --t5:#f08bbd; --t6:#e0c94f; --t7:#5ccfe6;
}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b1f27; --text:#e6e9ef; --muted:#9aa3b5; --line:#2b313d;
  --accent:#7ea2ff; --accent-soft:#22304f; --new:#ff8a50; --chip:#262b36;
  --t1:#7ea2ff; --t2:#4fd1a5; --t3:#b79bff; --t4:#ffaa66; --t5:#f08bbd; --t6:#e0c94f; --t7:#5ccfe6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-top:22px;padding-bottom:18px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:20px;padding-top:18px;padding-bottom:40px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.controls input,.controls select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.controls input{flex:1;min-width:180px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.card h3{margin:0;font-size:15.5px;font-weight:500;line-height:1.45}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;color:var(--accent)}
.meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.summary{font-size:13.5px;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--chip)}
.tag[data-i="0"]{color:var(--t1)}.tag[data-i="1"]{color:var(--t2)}.tag[data-i="2"]{color:var(--t3)}.tag[data-i="3"]{color:var(--t4)}.tag[data-i="4"]{color:var(--t5)}.tag[data-i="5"]{color:var(--t6)}.tag[data-i="6"]{color:var(--t7)}
.new{font-size:11px;font-weight:700;color:var(--new);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.univ{font:inherit;font-size:12px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;cursor:pointer}
details.more{margin-top:8px;font-size:13px}
details.more summary{cursor:pointer;color:var(--accent)}
details.more ul{margin:6px 0 0;padding-left:18px}
details.more li{margin:3px 0}
details.more li span{color:var(--muted);font-size:12px}
.side .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.side h2{font-size:14px;margin:0 0 10px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.rank li:last-child{border:0}
.rank button{font:inherit;background:none;border:0;color:var(--text);cursor:pointer;padding:0;text-align:left}
.rank button:hover{color:var(--accent)}
.rank em{font-style:normal;color:var(--muted);font-size:12px}
.status{font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.status li{padding:2px 0}
.status .bad{color:var(--new)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.active-filter{font-size:13px;margin-bottom:10px;color:var(--muted)}
.active-filter button{font:inherit;font-size:12px;margin-left:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>CTL 데일리 브리프</h1>
  <div class="sub">국내 대학 교수학습 · 교육과정 · 원격교육 · RISE · 교육정책 소식 모음 · <span id="updated">불러오는 중…</span></div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="wrap layout">
  <main>
    <div class="controls">
      <input id="q" type="search" placeholder="제목·요약·매체 검색 (예: 교수법, 영진전문대)">
      <select id="period">
        <option value="1">최근 24시간</option>
        <option value="3">최근 3일</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="0">전체</option>
      </select>
    </div>
    <div class="chips" id="tags"></div>
    <div class="active-filter" id="univFilter" hidden></div>
    <div id="list"></div>
  </main>
  <aside class="side">
    <div class="box">
      <h2>많이 언급된 대학 <em style="font-weight:400;color:var(--muted);font-size:12px">· 선택한 기간</em></h2>
      <ol class="rank" id="univRank"></ol>
    </div>
    <div class="box">
      <h2>수집 상태</h2>
      <ul class="status" id="status"></ul>
    </div>
  </aside>
</div>
<footer>기사 제목·요약·링크만 모아 보여주며, 저작권은 각 언론사에 있습니다. 매일 아침 자동 갱신됩니다.</footer>

<script>
const TAGS = ["교수학습", "교육과정", "원격교육", "RISE·재정사업", "AI·에듀테크", "정부·기관", "전문대학"];
const state = { q: "", period: 7, tag: "전체", univ: null };
let DATA = { items: [], status: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has("tag")) state.tag = p.get("tag");
  if (p.has("univ")) state.univ = p.get("univ");
  if (p.has("period")) state.period = +p.get("period");
  if (p.has("q")) state.q = p.get("q");
}
function writeHash() {  // 필터 상태를 주소에 담아 동료에게 그대로 공유할 수 있게 한다
  const p = new URLSearchParams();
  if (state.tag !== "전체") p.set("tag", state.tag);
  if (state.univ) p.set("univ", state.univ);
  if (state.period !== 7) p.set("period", state.period);
  if (state.q) p.set("q", state.q);
  history.replaceState(null, "", p.toString() ? "#" + p : location.pathname);
}

const fmtDay = d => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 864e5);
  const label = `${x.getMonth() + 1}월 ${x.getDate()}일 (${"일월화수목금토"[x.getDay()]})`;
  return diff === 0 ? "오늘 · " + label : diff === 1 ? "어제 · " + label : label;
};
const fmtTime = d => new Date(d).toTimeString().slice(0, 5);

function inPeriod(i) {
  if (!state.period) return true;
  return new Date(DATA.updated) - new Date(i.published) <= state.period * 864e5;
}
function isNew(i) { return new Date(DATA.updated) - new Date(i.first_seen) <= 864e5; }

function render() {
  writeHash();
  const q = state.q.trim().toLowerCase();
  const base = DATA.items.filter(inPeriod);
  const match = base.filter(i =>
    (state.tag === "전체" || i.tags.includes(state.tag)) &&
    (!state.univ || i.univs.includes(state.univ)) &&
    (!q || (i.title + " " + i.summary + " " + i.source).toLowerCase().includes(q)));

  // 같은 소식은 묶어서 가장 먼저 보도된 기사를 대표로 보여준다
  const groups = new Map();
  for (const i of match) {
    if (!groups.has(i.group)) groups.set(i.group, []);
    groups.get(i.group).push(i);
  }
  const leads = [...groups.values()].map(g => {
    g.sort((a, b) => (b.direct - a.direct) || a.published.localeCompare(b.published));
    const lead = g[0];
    return { lead, rest: g.slice(1), latest: g.reduce((m, x) => x.published > m ? x.published : m, lead.published) };
  }).sort((a, b) => b.latest.localeCompare(a.latest));

  // 태그 칩
  $("tags").innerHTML = ["전체", ...TAGS].map(t => {
    const n = t === "전체" ? base.length : base.filter(i => i.tags.includes(t)).length;
    return `<button class="chip" aria-pressed="${state.tag === t}" data-tag="${esc(t)}">${esc(t)} ${n}</button>`;
  }).join("");

  $("univFilter").hidden = !state.univ;
  $("univFilter").innerHTML = state.univ ? `대학 필터: <b>${esc(state.univ)}</b><button data-clear>해제</button>` : "";

  // 목록
  let html = "", lastDay = "";
  for (const { lead: i, rest, latest } of leads) {
    const day = fmtDay(latest);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    html += `<article class="card">
      <h3><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></h3>
      <div class="meta">
        ${[i, ...rest].some(isNew) ? '<span class="new">NEW</span>' : ""}
        <span>${esc(i.source)} · ${fmtTime(i.published)}</span>
        ${i.tags.map(t => `<span class="tag" data-i="${TAGS.indexOf(t)}">${esc(t)}</span>`).join("")}
        ${i.univs.map(u => `<button class="univ" data-univ="${esc(u)}">${esc(u)}</button>`).join("")}
      </div>
      ${i.summary ? `<p class="summary">${esc(i.summary)}</p>` : ""}
      ${rest.length ? `<details class="more"><summary>같은 소식 ${rest.length}건 더 보기</summary><ul>${
        rest.map(r => `<li><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a> <span>${esc(r.source)}</span></li>`).join("")
      }</ul></details>` : ""}
    </article>`;
  }
  $("list").innerHTML = html || `<div class="empty">조건에 맞는 소식이 없습니다.</div>`;

  // 대학 언급 순위 (같은 소식 묶음은 한 번만 센다)
  const cnt = new Map();
  const seen = new Set();
  for (const i of base) for (const u of i.univs) {
    const k = i.group + "|" + u;
    if (seen.has(k)) continue;
    seen.add(k); cnt.set(u, (cnt.get(u) || 0) + 1);
  }
  $("univRank").innerHTML = [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 15)
    .map(([u, n]) => `<li><button data-univ="${esc(u)}">${esc(u)}</button><em>${n}건</em></li>`).join("")
    || `<li><em>해당 기간 데이터 없음</em></li>`;

  $("stats").innerHTML = [
    ["새로 들어온 소식", DATA.items.filter(isNew).length, "최근 24시간"],
    ["표시 중", leads.length, "같은 소식은 1건으로"],
    ["누적 기사", DATA.items.length, "최근 90일"],
  ].map(([a, b, c]) => `<div class="stat"><span>${a}</span><b>${b}</b><span>${c}</span></div>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tag],[data-univ],[data-clear]");
  if (!t) return;
  if (t.dataset.tag) state.tag = t.dataset.tag;
  else if (t.dataset.univ) { state.univ = t.dataset.univ; window.scrollTo({ top: 0, behavior: "smooth" }); }
  else state.univ = null;
  render();
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("period").addEventListener("change", e => { state.period = +e.target.value; render(); });

readHash();
$("q").value = state.q;
$("period").value = String(state.period);
fetch("items.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  DATA = d;
  const u = new Date(d.updated);
  $("updated").textContent = `마지막 갱신 ${u.getMonth() + 1}월 ${u.getDate()}일 ${fmtTime(u)}`;
  $("status").innerHTML = d.status.map(s => s.ok
    ? `<li>✓ ${esc(s.name)} <span>(${s.count}건)</span></li>`
    : `<li class="bad">✕ ${esc(s.name)} — 수집 실패</li>`).join("");
  render();
}).catch(() => { $("list").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다.</div>`; });
</script>
</body>
</html>
